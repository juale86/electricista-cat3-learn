# Compila la app con Vite y la publica en GitHub Pages en cada push a main
name: Deploy a GitHub Pages

on:
  push:
    branches: ['main']
  # Permite correrlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; no cancela el que está en curso
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
        env:
          # Ej.: /electricista-cat3-learn/
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # Pages no conoce las rutas de la app: con 404.html = index.html, entrar directo a /plano también funciona
      - name: Fallback para rutas
        run: cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
